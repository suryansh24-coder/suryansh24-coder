<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="430"
     viewBox="0 0 1100 430">

  <defs>

    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#16233b"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121c2e"/>
      <stop offset="100%" stop-color="#0c1421"/>
    </linearGradient>

    <!-- Animated rotating gradients (card borders) -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffd43b"/>
      <stop offset="75%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
      <animateTransform attributeName="gradientTransform"
                        type="rotate"
                        from="0 0.5 0.5"
                        to="360 0.5 0.5"
                        dur="7s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e6ff"/>
      <stop offset="40%" stop-color="#7c83ff"/>
      <stop offset="75%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform"
                        type="rotate"
                        from="360 0.5 0.5"
                        to="0 0.5 0.5"
                        dur="9s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#398cff"/>
      <stop offset="75%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform"
                        type="rotate"
                        from="0 0.5 0.5"
                        to="360 0.5 0.5"
                        dur="8s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="headerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#ffd43b"/>
      <stop offset="55%" stop-color="#7c83ff"/>
      <stop offset="80%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#1e293b"/>
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-1 0; 1 0; -1 0"
                        dur="10s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Soft glow filters -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>

  <!-- MAIN BACKGROUND -->
  <rect width="1100" height="430" rx="22" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="1098" height="428" rx="21"
        fill="none" stroke="#1e2a3d" stroke-width="1.5"/>

  <!-- HEADER -->
  <text x="550" y="52"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26"
        font-weight="bold"
        letter-spacing="1.5"
        text-anchor="middle">
    ACHIEVEMENTS &amp; RECOGNITION
  </text>

  <rect x="70" y="72" width="960" height="2" rx="1" fill="url(#headerLine)" opacity="0.9"/>


  <!-- ================================= -->
  <!-- CARD 1: GDG TECHYUVA -->
  <!-- ================================= -->
  <g>
    <!-- glow -->
    <rect x="30" y="95" width="330" height="280" rx="24"
          fill="none" stroke="#ffb020" stroke-width="8"
          opacity="0.45" filter="url(#glow)"/>
    <!-- body -->
    <rect x="30" y="95" width="330" height="280" rx="24" fill="url(#cardBg)"/>
    <!-- animated gradient border -->
    <rect x="30" y="95" width="330" height="280" rx="24"
          fill="none"
          stroke="url(#goldBorder)"
          stroke-width="2.8"
          stroke-dasharray="18 10">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
    </rect>

    <!-- Icon -->
    <circle cx="90" cy="155" r="28" fill="#1a2334" stroke="#ffca28" stroke-width="1.6"/>
    <text x="90" y="165" font-size="25" text-anchor="middle">🏆</text>

    <!-- Category -->
    <text x="132" y="145" fill="#ffca28" font-family="Arial, Helvetica, sans-serif"
          font-size="12" font-weight="bold" letter-spacing="1.4">HACKATHON RECOGNITION</text>
    <text x="132" y="168" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="11" letter-spacing="1">GDG × TECHYUVA</text>

    <!-- Achievement -->
    <text x="62" y="246" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
          font-size="42" font-weight="bold">2nd Place</text>
    <text x="62" y="279" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="bold">Build-a-thon Winner</text>
    <text x="62" y="304" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif"
          font-size="13.5">GDG × TechYuva Build-a-thon</text>

    <!-- Footer -->
    <line x1="62" y1="326" x2="328" y2="326" stroke="#2b3a52"/>
    <text x="62" y="352" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="10" letter-spacing="1">SELECTED AMONG</text>
    <text x="328" y="352" fill="#ffca28" font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="bold" text-anchor="end">1,200+ PARTICIPANTS</text>
  </g>


  <!-- ================================= -->
  <!-- CARD 2: GSSOC 2026 -->
  <!-- ================================= -->
  <g>
    <!-- glow -->
    <rect x="385" y="95" width="330" height="280" rx="24"
          fill="none" stroke="#818cf8" stroke-width="8"
          opacity="0.45" filter="url(#glow)"/>
    <!-- body -->
    <rect x="385" y="95" width="330" height="280" rx="24" fill="url(#cardBg)"/>
    <!-- animated gradient border -->
    <rect x="385" y="95" width="330" height="280" rx="24"
          fill="none"
          stroke="url(#purpleBorder)"
          stroke-width="2.8"
          stroke-dasharray="18 10">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-28" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Icon -->
    <circle cx="445" cy="155" r="28" fill="#1a2334" stroke="#818cf8" stroke-width="1.6"/>
    <text x="445" y="165" fill="#38bdf8" font-size="25" text-anchor="middle">🌐</text>

    <!-- Category -->
    <text x="487" y="145" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif"
          font-size="12" font-weight="bold" letter-spacing="1.2">OPEN-SOURCE RECOGNITION</text>
    <text x="487" y="168" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="11" letter-spacing="0.8">GIRLSCRIPT SUMMER OF CODE 2026</text>

    <!-- Achievement -->
    <text x="417" y="246" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
          font-size="46" font-weight="bold">#363</text>
    <text x="417" y="279" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="bold">Global Rank</text>
    <text x="417" y="304" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif"
          font-size="13.5">GirlScript Summer of Code 2026</text>

    <!-- Footer -->
    <line x1="417" y1="326" x2="683" y2="326" stroke="#2b3a52"/>
    <text x="417" y="352" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="10" letter-spacing="1">COMMUNITY</text>
    <text x="683" y="352" fill="#c4b5fd" font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="bold" text-anchor="end">OPEN SOURCE</text>
  </g>


  <!-- ================================= -->
  <!-- CARD 3: INFRASHIFT HACKATHON -->
  <!-- ================================= -->
  <g>
    <!-- glow -->
    <rect x="740" y="95" width="330" height="280" rx="24"
          fill="none" stroke="#38bdf8" stroke-width="8"
          opacity="0.45" filter="url(#glow)"/>
    <!-- body -->
    <rect x="740" y="95" width="330" height="280" rx="24" fill="url(#cardBg)"/>
    <!-- animated gradient border -->
    <rect x="740" y="95" width="330" height="280" rx="24"
          fill="none"
          stroke="url(#blueBorder)"
          stroke-width="2.8"
          stroke-dasharray="18 10">
      <animate attributeName="stroke-dashoffset"
               from="0" to="-28" dur="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Icon -->
    <circle cx="800" cy="155" r="28" fill="#1a2334" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="800" y="165" fill="#38bdf8" font-size="25" text-anchor="middle">🥉</text>

    <!-- Category -->
    <text x="842" y="145" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif"
          font-size="12" font-weight="bold" letter-spacing="1.2">HACKATHON RECOGNITION</text>
    <text x="842" y="168" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="11.5" letter-spacing="0.8">INFRASITY × ML.ai</text>

    <!-- Achievement -->
    <text x="772" y="246" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
          font-size="40" font-weight="bold">3rd Prize</text>
    <text x="772" y="279" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="bold">InfraShift Hackathon</text>
    <text x="772" y="304" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif"
          font-size="13.5">Secured 3rd Position Overall</text>

    <!-- Footer -->
    <line x1="772" y1="326" x2="1038" y2="326" stroke="#2b3a52"/>
    <text x="772" y="352" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif"
          font-size="10" letter-spacing="1">COMPETITION</text>
    <text x="1038" y="352" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="bold" text-anchor="end">847+ PARTICIPANTS</text>
  </g>

</svg>
