<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Achievements and Recognition</title>
  <desc id="desc">Three achievement cards: second place at GDG TechYuva, global rank 363 at GirlScript Summer of Code 2026, and third prize at InfraShift ML.ai among 847 participants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d17"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0a6"/><stop offset="1" stop-color="#ff7900"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <style>
      .heading{font:700 29px Arial,sans-serif;letter-spacing:2px;fill:#f8fafc}
      .eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px}
      .org{font:600 14px Arial,sans-serif;letter-spacing:1.7px;fill:#aab7ca}
      .big{font:800 49px Arial,sans-serif;fill:#f8fafc}
      .sub{font:700 23px Arial,sans-serif;fill:#f1f5f9}
      .body{font:400 18px Arial,sans-serif;fill:#cbd5e1}
      .small{font:700 13px Arial,sans-serif;letter-spacing:1.5px;fill:#94a3b8}
      .metric{font:800 20px Arial,sans-serif}
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="470" rx="22" fill="#070b12"/>
  <text x="750" y="47" text-anchor="middle" class="heading">ACHIEVEMENTS &amp; RECOGNITION</text>
  <line x1="70" y1="70" x2="1430" y2="70" stroke="#273449" stroke-width="1.5"/>

  <!-- Card 1 -->
  <rect x="55" y="96" width="440" height="325" rx="24" fill="url(#bg)" stroke="url(#gold)" stroke-width="3" stroke-dasharray="18 10"/>
  <circle cx="112" cy="151" r="31" fill="#1a2435" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="112" y="162" text-anchor="middle" font-size="31">🏆</text>
  <text x="160" y="140" class="eyebrow" fill="#fbbf24">HACKATHON RECOGNITION</text>
  <text x="160" y="166" class="org">GDG × TECHYUVA</text>
  <text x="82" y="245" class="big">2nd Place</text>
  <text x="83" y="281" class="sub">Build-a-thon Winner</text>
  <text x="83" y="316" class="body">GDG × TechYuva Build-a-thon</text>
  <line x1="82" y1="344" x2="468" y2="344" stroke="#334155" stroke-width="1.5"/>
  <text x="83" y="380" class="small">SELECTED AMONG</text>
  <text x="468" y="380" text-anchor="end" class="metric" fill="#fbbf24">1,200+ PARTICIPANTS</text>

  <!-- Card 2 -->
  <rect x="530" y="96" width="440" height="325" rx="24" fill="url(#bg)" stroke="url(#purple)" stroke-width="3" stroke-dasharray="18 10"/>
  <circle cx="587" cy="151" r="31" fill="#1a2435" stroke="#818cf8" stroke-width="1.5"/>
  <text x="587" y="162" text-anchor="middle" font-size="31">🌐</text>
  <text x="635" y="140" class="eyebrow" fill="#a5b4fc">OPEN-SOURCE RECOGNITION</text>
  <text x="635" y="166" class="org">GIRLSCRIPT SUMMER OF CODE · 2026</text>
  <text x="557" y="245" class="big">#363</text>
  <text x="558" y="281" class="sub">Global Rank</text>
  <text x="558" y="316" class="body">GirlScript Summer of Code 2026</text>
  <line x1="557" y1="344" x2="943" y2="344" stroke="#334155" stroke-width="1.5"/>
  <text x="558" y="380" class="small">COMMUNITY</text>
  <text x="943" y="380" text-anchor="end" class="metric" fill="#c4b5fd">OPEN SOURCE</text>

  <!-- Card 3 -->
  <rect x="1005" y="96" width="440" height="325" rx="24" fill="url(#bg)" stroke="url(#green)" stroke-width="3" stroke-dasharray="18 10"/>
  <circle cx="1062" cy="151" r="31" fill="#1a2435" stroke="#34d399" stroke-width="1.5"/>
  <text x="1062" y="162" text-anchor="middle" font-size="31">🥉</text>
  <text x="1110" y="140" class="eyebrow" fill="#4ade80">HACKATHON RECOGNITION</text>
  <text x="1110" y="166" class="org">INFRASHIFT × ML.AI</text>
  <text x="1032" y="245" class="big">3rd Prize</text>
  <text x="1033" y="281" class="sub">Hackathon Achievement</text>
  <text x="1033" y="316" class="body">InfraShift × ML.ai Hackathon</text>
  <line x1="1032" y1="344" x2="1418" y2="344" stroke="#334155" stroke-width="1.5"/>
  <text x="1033" y="380" class="small">COMPETITION</text>
  <text x="1418" y="380" text-anchor="end" class="metric" fill="#4ade80">847 PARTICIPANTS</text>
</svg>